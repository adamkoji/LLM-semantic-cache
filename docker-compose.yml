version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: semantiq-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semantiq-api
    ports:
      - "8000:7860"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=7860
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - LLM_TIMEOUT_SECONDS=15.0
      - CHROMA_PERSIST_DIR=/tmp/chroma_cache
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
